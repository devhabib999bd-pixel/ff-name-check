{% extends "base.html" %}{% block title %}Admin login{% endblock %}
{% block body %}
<div class="center card">
  <h1>Admin login</h1><p class="sub">Free Fire ID Checker control panel</p>
  <form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Username</label><input type="text" name="username" autofocus required>
    <label>Password</label><input type="password" name="password" required>
    <p><button class="btn" style="width:100%;margin-top:14px">Sign in</button></p>
  </form>
</div>
{% endblock %}
