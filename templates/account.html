{% extends "base.html" %}{% block title %}Account{% endblock %}
{% block body %}
<h1>Admin account</h1><p class="sub">Change your login. Use a long password. This panel holds your Garena cookie.</p>
<div class="card" style="max-width:480px"><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Username</label><input type="text" name="username" value="{{ session.admin }}">
  <label>Current password</label><input type="password" name="current" required>
  <label>New password (10+ characters)</label><input type="password" name="new" required>
  <label>Confirm new password</label><input type="password" name="confirm" required>
  <p><button class="btn">Update login</button></p></form></div>
{% endblock %}
